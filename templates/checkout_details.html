{% extends "base.html" %}
{% block title %}EcoThrift{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">
  <link href="../vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
  <link
    href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
    rel="stylesheet">
  <link href="../css/sb-admin-2.css" rel="stylesheet">
  <link href="/css/checkout_details.css" rel="stylesheet">
</head>

<body>
  <h2>Checkout</h2>
  <div class="row">
    <div class="col-75">
      <div class="container">
        <form id="checkout_form_data" method="post">
          <div class="row">
            <div class="col-50">
              <br>
              <label for="fname"><i class="fa fa-user"></i> Full Name</label>
              <input type="text" id="fname" name="fname" placeholder="Alex Tan" required>
              <label for="email"><i class="fa fa-envelope"></i> Email</label>
              <input type="email" id="email" name="email" placeholder="alextan@gmail.com" required>
              <label for="adr"><i class="fa fa-address-card-o"></i> Address</label>
              <input type="text" id="adr" name="address" placeholder="Bedok Street 12" required>
              <label for="city"><i class="fa fa-institution"></i> City</label>
              <input type="text" id="city" name="city" placeholder="Singapore" required>
              <div class="row">
                <div class="col-50">
                  <label for="zip">Zip Code</label>
                  <input type="number" id="zip" name="zip" placeholder="10001" required>
                </div>
              </div>
            </div>

            <div class="col-50">
              <br>
              <label for="cname">Name on Card</label>
              <input type="text" id="cname" name="cardname" placeholder="Alex Tan" required>
              <label for="ccnum">Credit card number</label>
              <input type="text" id="ccnum" name="cardnumber" placeholder="1111-2222-3333-4444" required>
              <label for="expmonth">Expiry Month</label>
              <input type="text" id="expmonth" name="expmonth" placeholder="March" required>
              <div class="row">
                <div class="col-50">
                  <label for="expyear">Exp Yr</label>
                  <input type="text" id="expyear" name="expyear" placeholder="2030" required>
                </div>
                <div class="col-50">
                  <label for="cvv">CVV</label>
                  <input type="number" id="cvv" name="cvv" placeholder="333" required>
                </div>
              </div>
            </div>
          </div>
        </form>
        <button data-modal-target="#modal" type="button" onclick="submitForm()" id="checkout-button"
          style="width: 100%;">Confirm Purchase</button>
        <div class="modal" id="modal">
          <div class="modal-header">
            <button data-close-button class="close-button">&times;</button>
          </div>
          <div class="modal-body">
            <div class="success-icon">&#10003;</div> <!-- Checkmark icon for success -->
            <p class="success-message">Thank you for your purchase, <span id="modal-username">Name</span>!</p>
            <p class="sub-message">Here are the details of your purchase:</p>
            <ul id="cart-items2">TEST</ul>
            <hr>
            <p id="cart-total2">TotaL</p>
            <p id="modal-email"></P>
            <button class="btn btn-primary" onclick="goHome()" class="">Go Home</button>
          </div>
        </div>
        <div id="overlay"></div>
      </div>
    </div>
    <div class="col-25">
      <div class="container">
        <h4>Cart </h4>
        <ul id="cart-items"></ul>
        <hr>
        <p id="cart-total">TotaL</p>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const storedCart = sessionStorage.getItem('cart');
      let cart = storedCart ? JSON.parse(storedCart) : { quantity: 0, contents: [] };

      function updateCartContents() {
        const cartItemsElement = document.getElementById('cart-items');
        const cartTotalElement = document.getElementById('cart-total');
        const cartItemsElement2 = document.getElementById('cart-items2');
        const cartTotalElement2 = document.getElementById('cart-total2');

        cartItemsElement.innerHTML = '';
        let total = 0;

        cartItemsElement2.innerHTML = '';
        let total2 = 0;

        cart.contents.forEach(item => {
          total += item.price * item.quantity;

          const listItem = document.createElement('li');
          listItem.innerHTML = `
                          <span>${item.name} - $${item.price.toFixed(2)} </span>
 

                      `;
          cartItemsElement.appendChild(listItem);
        });
        cartTotalElement.textContent = `Total: $${total.toFixed(2)}`;

        //for modal
        cart.contents.forEach(item => {
          total2 += item.price * item.quantity;
          const listItem = document.createElement('li');
          listItem.innerHTML = `
                          <span>${item.name} - $${item.price.toFixed(2)} </span>

                      `;
          cartItemsElement2.appendChild(listItem);
        });

        cartTotalElement2.textContent = `Total: $${total2.toFixed(2)}`;

      }

      const form = document.getElementById('checkout_form_data');
      const openModalButtons = document.querySelectorAll('[data-modal-target]');
      const closeModalButtons = document.querySelectorAll('[data-close-button]');
      const overlay = document.getElementById('overlay');

      // Function to submit form and handle modal
      function submitForm() {
        const username = document.getElementById('fname').value;
        const email = document.getElementById('email').value;

        if (form.checkValidity()) {
          // Update modal content
          document.getElementById('modal-username').textContent = username;
          document.getElementById('modal-email').textContent = email;

          // Open the modal
          const modal = document.querySelector('#modal'); // Adjust modal selector as needed
          openModal(modal);

          // Optionally submit the form or perform other actions
          alert('Form is valid. Proceeding with submission...');
        } else {
          // Show validation messages
          alert('Please fill out all required fields.');
          form.reportValidity();
        }
      }

      openModalButtons.forEach(button => {
        button.addEventListener('click', (event) => {
          event.preventDefault(); // Prevent default behavior

          // Trigger form submission check
          submitForm();
        });
      });

      overlay.addEventListener('click', () => {
        const modals = document.querySelectorAll('.modal.active');
        modals.forEach(modal => {
          closeModal(modal);
        });
      });

      closeModalButtons.forEach(button => {
        button.addEventListener('click', () => {
          const modal = button.closest('.modal');
          closeModal(modal);
        });
      });

      function openModal(modal) {
        if (modal == null) return;
        modal.classList.add('active');
        overlay.classList.add('active');
      }

      function closeModal(modal) {
        if (modal == null) return;
        modal.classList.remove('active');
        overlay.classList.remove('active');
      }
      window.goHome = function () {

        window.location.href = 'home';

      }

      function sendCartDataToServer() {

        const storedCart = sessionStorage.getItem('cart');
        if (storedCart) {
          const cart = JSON.parse(storedCart);
          const productIds = cart.contents.map(item => item.id);

          // Send the data to the server
          fetch('add_transactions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ product_id: productIds })
          })

            .then(data => {
              console.log('Server response:', data);
            })
            .catch(error => {
              console.error('Error:', error);
            });
        }
      }

      updateCartContents();
      sendCartDataToServer();
    }); 
  </script>

</html>

{% endblock %}
